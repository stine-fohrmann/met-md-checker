
attributes:
  title:
    type: ACDD/CF
    description: 'A short phrase or sentence describing the dataset. In many discovery systems, the title will be displayed in the results list from a search, and therefore should be human readable and reasonable to display in a list of such names. This attribute is also recommended by the NetCDF Users Guide and the CF conventions.'
    comments : Provided in English
    checks:
      - id: title/exists
        type: exists
        severity: error
        message: is not defined.
      - id: title/nonempty
        type: nonempty
        conditions: 
          - title/exists
        severity: error
        message: is empty.
  
  summary:
    type: ACDD
    description: 'A paragraph describing the dataset, analogous to an abstract for a paper.'
    comments: Provided in English
    checks:
      - id: summary/exists
        type: exists
        severity: error
        message: is not defined.
      - id: summary/nonempty
        type: nonempty
        conditions: 
          - summary/exists
        severity: warning
        message: is empty.
  
  keywords:
    type: ACDD
    description: 'A comma-separated list of keywords and/or phrases. Keywords may be common words or phrases, terms from a controlled vocabulary.'
    comments: "If keywords are extracted from e.g. GCMD Science Keywords, add keywords_vocabulary='GCMDSK' and prefix in any case each keyword with the appropriate prefix."
    checks:
      - id: keywords/exists
        type: exists
        severity: error
        message: 'is not defined.'
      - id: keywords/nonempty
        type: nonempty
        conditions:
          - keywords/exists
        severity: error
        message: 'is empty.'
      # Verify that no keyword entry is empty
      - id: keywords/entries_nonempty
        type: entries_nonempty
        conditions:
          - keywords/exists
          - keywords/nonempty
        severity: error
        message: contains an empty entry.
      # Verify that each keyword entry has a prefix
      - id: keywords/entries_prefixed
        type: entries_prefixed
        conditions:
          - keywords/exists
          - keywords/nonempty
        severity: error
        message: |
          contains a keyword without a vocabulary prefix.
          Prefix each keyword with the correct vocabulary prefix.
          Example: "GCMDSK:EARTH SCIENCE > OCEANS"
      # Verify that at least one GCMD Science Keyword is defined and prefixed with "GCMDSK:"
      - id: keywords/gcmdsk_present
        type: gcmdsk_present
        conditions:
          - keywords/exists
          - keywords/nonempty
          - keywords/entries_prefixed
        severity: error
        message: 'contains no GCMD science keyword. Include at least one keyword prefixed with "GCMDSK:"'
      # Verify that GCMD science keyword is valid
      - id: keywords/valid_gcmdsk
        type: valid_gcmdsk
        conditions:
          - keywords/exists
          - keywords/nonempty
          - keywords/entries_prefixed
          - keywords/gcmdsk_present
        severity: error
        message: |
          contains an invalid GCMD science keyword.
          Include the full path of valid keywords formatted like "GCMDSK:[category] > [topic] > [...]".

  keywords_vocabulary:
    type: ACDD
    description: If you are using a controlled vocabulary for the words/phrases in your "keywords" attribute, this is the unique name or identifier of the vocabulary from which keywords are taken. If more than one keyword vocabulary is used, each may be presented with a prefix and a following comma, so that keywords may optionally be prefixed with the controlled vocabulary key.
    comments: "If more than one keyword vocabulary is used, each may be presented with a prefix and a following comma. E.g.: ‘GCMDSK:GCMD Science Keywords, ..’ Keywords should in this case be prefixed with the appropriate controlled vocabulary key. When keywords_vocabulary is not specified the default value of None will be used. "
    checks:
      - id: keywords_vocabulary/exists
        type: exists
        severity: error
        message: 'is not defined.'
      - id: keywords_vocabulary/nonempty
        type: nonempty
        conditions:
          - keywords_vocabulary/exists
        severity: error
        message: 'is empty.'
      # Verify that no entry is empty
      - id: keywords_vocabulary/entries_nonempty
        type: entries_nonempty
        conditions:
          - keywords_vocabulary/exists
          - keywords_vocabulary/nonempty
        severity: error
        message: contains an empty entry.
      # Verify that each entry has a prefix
      - id: keywords_vocabulary/entries_prefixed
        type: entries_prefixed
        conditions:
          - keywords_vocabulary/exists
          - keywords_vocabulary/nonempty
          - keywords_vocabulary/entries_nonempty
        severity: error
        message: |
          contains a vocabulary without a prefix.
          Prefix each vocabulary with the correct prefix.
          Example: "GCMDSK:GCMD Science Keywords:https://gcmd.earthdata.nasa.gov/kms/concepts/concept_scheme/sciencekeywords"
      # Verify that at least reference to GCMDSK is given
      - id: keywords_vocabulary/gcmdsk_present
        type: gcmdsk_present
        conditions:
          - keywords_vocabulary/exists
          - keywords_vocabulary/nonempty
          - keywords_vocabulary/entries_nonempty
          - keywords_vocabulary/entries_prefixed
        severity: error
        message: |
          contains no reference to GCMD science keywords.
          Include a reference to GCMD science keywords in the following format:
          "GCMDSK:GCMD Science Keywords:https://gcmd.earthdata.nasa.gov/kms/concepts/concept_scheme/sciencekeywords"
  
  geospatial_lat_min:
    type: ACDD
    description: Describes a simple lower latitude limit; may be part of a 2- or 3-dimensional bounding region. Geospatial_lat_min specifies the southernmost latitude covered by the dataset. Must be decimal degrees north.
    comments: Use at least 2 decimals. This must be decimal degrees north.
    checks:
      - id: geospatial_lat_min/exists
        type: exists
        severity: error
        message: is not defined.
      - id: geospatial_lat_min/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - geospatial_lat_min/exists
      # Verify that the latitude is a number between -90 and 90
      - id: geospatial_lat_min/valid_lat
        type: is_between
        args:
          min: -90
          max: 90
        severity: error
        message: has an invalid value. Must be a number between -90 and 90.
        conditions:
          - geospatial_lat_min/exists
          - geospatial_lat_min/nonempty
      # Verify that at least 2 decimal points are included
      - id: geospatial_lat_min/min_2_decs
        type: min_decimals
        args:
          min_decs: 2
        severity: error
        message: has too few decimal points. Include at least 2 decimal points.
        conditions:
          - geospatial_lat_min/exists
          - geospatial_lat_min/nonempty
  
  geospatial_lat_max:
    type: ACDD
    description: Describes a simple upper latitude limit; may be part of a 2- or 3-dimensional bounding region. Geospatial_lat_max specifies the northernmost latitude covered by the dataset. Must be decimal degrees north.
    comments: Use at least 2 decimals. This must be decimal degrees north.
    checks:
      - id: geospatial_lat_max/exists
        type: exists
        severity: error
        message: 'is not defined.'
      - id: geospatial_lat_max/nonempty
        type: nonempty
        severity: error
        message: 'is empty.'
        conditions:
          - geospatial_lat_max/exists
      # Verify that the latitude is a number between -90 and 90
      - id: geospatial_lat_max/valid_lat
        type: is_between
        severity: error
        message: has an invalid value. Must be a number between -90 and 90.
        args:
          min: -90
          max: 90
        conditions:
          - geospatial_lat_max/exists
          - geospatial_lat_max/nonempty
      # Verify that at least 2 decimal points are included
      - id: geospatial_lat_max/min_2_decs
        type: min_decimals
        args:
          min_decs: 2
        severity: error
        message: has too few decimal points. Include at least 2 decimal points.
        conditions:
          - geospatial_lat_max/exists
          - geospatial_lat_max/nonempty
  
  geospatial_lon_min:
    type: ACDD
    description: Describes a simple longitude limit; may be part of a 2- or 3-dimensional bounding region. geospatial_lon_min specifies the westernmost longitude covered by the dataset. See also geospatial_lon_max. Must be decimal degrees east (negative westwards).
    comments: Use at least 2 decimals. This must be decimal degrees east (negative westwards).
    checks:
      - id: geospatial_lon_min/exists
        type: exists
        severity: error
        message: is not defined.
      - id: geospatial_lon_min/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - geospatial_lon_min/exists
      # Verify that longitude is a number between -180 and 180
      - id: geospatial_lon_min/valid_lon
        type: is_between
        args:
          min: -180
          max: 180
        severity: error
        message: has an invalid value. Must be a number between -180 and 180.
        conditions:
          - geospatial_lon_min/exists
          - geospatial_lon_min/nonempty
      # Verify that at least 2 decimal points are included
      - id: geospatial_lon_min/min_2_decs
        type: min_decimals
        args:
          min_decs: 2
        severity: error
        message: has too few decimal points. Include at least 2 decimal points.
        conditions:
          - geospatial_lon_min/exists
          - geospatial_lon_min/nonempty
  
  geospatial_lon_max:
    type: ACDD
    description: Describes a simple longitude limit; may be part of a 2- or 3-dimensional bounding region. geospatial_lon_max specifies the easternmost longitude covered by the dataset. Must be decimal degrees east (negative westwards).
    comments: Use at least 2 decimals. This must be decimal degrees east (negative westwards).
    checks:
      - id: geospatial_lon_max/exists
        type: exists
        severity: error
        message: is not defined.
      - id: geospatial_lon_max/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - geospatial_lon_max/exists
      # Verify that longitude is a number between -180 and 180
      - id: geospatial_lon_max/valid_lon
        type: is_between
        args:
          min: -180
          max: 180
        severity: error
        message: has an invalid value. Must be a number between -180 and 180.
        conditions:
          - geospatial_lon_max/exists
          - geospatial_lon_max/nonempty
      # Verify that at least 2 decimal points are included
      - id: geospatial_lon_max/min_2_decs
        type: min_decimals
        args:
          min_decs: 2
        severity: error
        message: has too few decimal points. Include at least 2 decimal points.
        conditions:
          - geospatial_lon_max/exists
          - geospatial_lon_max/nonempty

  time_coverage_start:
    type: ACDD
    description: Describes the time of the first data point in the data set. Use the ISO 8601:2004 date format, preferably the extended format as recommended in the Attribute Content Guidance section. I.e. YYYY-MM-DDTHH:MM:SSZ (always use UTC).
    comments:
    checks:
      - id: time_coverage_start/exists
        type: exists
        severity: error
        message: is not defined.
      - id: time_coverage_start/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - time_coverage_start/exists
      # Verify that the time stamp is a valid time in ISO 8601:2004 format
      - id: time_coverage_start/correct_time_format
        type: iso_8601_2004
        severity: error
        message: is not in ISO 8601:2004 format. Use YYYY-MM-DDTHH:MM:SSZ (always use UTC).
        conditions:
          - time_coverage_start/exists
          - time_coverage_start/nonempty
      # Verify that the time stamp is a valid datetime
      - id: time_coverage_start/valid_date_time
        type: valid_date_time
        severity: error
        message: is not a valid time.
        conditions:
          - time_coverage_start/exists
          - time_coverage_start/nonempty
          - time_coverage_start/correct_time_format

  time_coverage_end:
    type: ACDD
    description: Describes the time of the last data point in the data set. Use ISO 8601:2004 date format, preferably the extended format as recommended in the Attribute Content Guidance section. I.e. YYYY-MM-DDTHH:MM:SSZ (always use UTC).
    comments: If the file is being appended with new data, this can be left out and the dataset will then be considered an ongoing effort.
    checks:
      - id: time_coverage_end/exists
        type: exists
        severity: error
        message: is not defined.
      - id: time_coverage_end/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - time_coverage_end/exists
      # Verify that the time stamp is a valid time in ISO 8601:2004 format
      - id: time_coverage_end/correct_time_format
        type: iso_8601_2004
        severity: error
        message: is not in ISO 8601:2004 format. Use YYYY-MM-DDTHH:MM:SSZ (always use UTC).
        conditions:
          - time_coverage_end/exists
          - time_coverage_end/nonempty
      # Verify that the time stamp is a valid datetime
      - id: time_coverage_end/valid_date_time
        type: valid_date_time
        severity: error
        message: is not a valid time.
        conditions:
          - time_coverage_end/exists
          - time_coverage_end/nonempty
          - time_coverage_end/correct_time_format
    
  date_created:
    type: ACDD
    description: The date on which this version of the data was created. (Modification of values implies a new version, hence this would be assigned the date of the most recent values modification.) Metadata changes are not considered when assigning the date_created. The ISO 8601:2004 extended date format is recommended, as described in the Attribute Content Guidance section. E.g. 2020-10-20T12:35:00Z.
    comments: If date_created is not provided, a default current datetime stamp will be generated.
    checks:
      - id: date_created/exists
        type: exists
        severity: error
        message: is not defined.
      - id: date_created/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - date_created/exists
      # Verify that the time stamp is a valid time in ISO 8601:2004 format
      - id: date_created/correct_time_format
        type: iso_8601_2004
        severity: error
        message: is not in ISO 8601:2004 format. Use YYYY-MM-DDTHH:MM:SSZ (always use UTC).
        conditions:
          - date_created/exists
          - date_created/nonempty
      # Verify that the time stamp is a valid datetime
      - id: date_created/valid_date_time
        type: valid_date_time
        severity: error
        message: is not a valid time.
        conditions:
          - date_created/exists
          - date_created/nonempty
          - date_created/correct_time_format

  license:
    type: ACDD
    description: Provide the URL and identifier to a standard license. It is strongly recommended to use identifiers and URL's from https://spdx.org/licenses/ and to use a form similar to <URL> (<Identifier>) using elements from the SPDX source listed above.
    comments: 'The recommended way to provide this information is license: "http://spdx.org/licenses/CC-BY-4.0 (CC-BY-4.0)". If a standard license cannot be parsed this field will be extracted into free text.'
    checks:
      - id: license/exists
        type: exists
        severity: error
        message: is not defined.
      - id: license/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - license/exists
      # Verify each entry has format <URL> (<Identifier>)
      - id: license/formatted_correctly
        type: license_formatted_correctly
        severity: error
        message: contains an incorrectly formatted entry. Use the form "<URL> (<Identifier>)" and separate entries with a comma.
        conditions:
          - license/exists
          - license/nonempty
      # Verify given license is a SPDX license
      - id: license/valid_spdx_license
        type: spdx_license
        severity: error
        message: |
          is not a valid SPDX license.
          Include a standard license from https://spdx.org/licenses/.
        conditions:
          - license/exists
          - license/nonempty
          - license/formatted_correctly

  creator_type:
    type: ACDD
    description: "Specifies the type of creator with one of the following: 'person', 'group', 'institution', or 'position'. If this attribute is not specified, the creator is assumed to be a person."
    comments: "Do not use ',' except for separating elements. Use this for principal Investigator. Consistency across comma separated lists for all creator_* attributes are required."
    checks:
      - id: creator_type/exists
        type: exists
        severity: error
        message: is not defined.
      - id: creator_type/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - creator_type/exists
      # Verify all entries are nonempty
      - id: creator_type/entries_nonempty
        type: entries_nonempty
        severity: error
        message: contains an empty entry.
        conditions:
          - creator_type/exists
          - creator_type/nonempty
      # Verify each entry is one of 'person', 'group', 'institution', or 'position'
      - id: creator_type/entries_valid
        type: creator_types_valid
        severity: error
        message: contains an invalid creator type. Each type must be one of 'person', 'group', 'institution', or 'position'.
        conditions:
          - creator_type/exists
          - creator_type/nonempty
          - creator_type/entries_nonempty
  
  creator_name:
    type: ACDD
    description: "The name of the person (or other creator type specified by the creator_type attribute) principally responsible for creating this data."
    comments: "Do not use ',' except for separating elements. Write names as 'First1 Last1, First2 Last2'. Consistency across comma separated lists for all creator_* attributes are required."
    checks:
      - id: creator_name/exists
        type: exists
        severity: error
        message: is not defined.
      - id: creator_name/nonempty
        type: nonempty
        severity: error
        message: is empty.
        conditions:
          - creator_name/exists
      # Verify all entries are nonempty
      - id: creator_name/entries_nonempty
        type: entries_nonempty
        severity: error
        message: contains an empty entry.
        conditions:
          - creator_name/exists
          - creator_name/nonempty

cross_checks:
  # Verify that each prefix in 'keywords' is used in 'keywords_vocabulary' and vice versa
  - id: cc/keywords_map_to_vocabulary
    type: keywords_map_to_vocabulary
    involved_attributes: [keywords, keywords_vocabulary]
    conditions: # list of checks that must pass before cross-checking
      - keywords/exists
      - keywords/nonempty
      - keywords/entries_nonempty
      - keywords/entries_prefixed
      - keywords_vocabulary/exists
      - keywords_vocabulary/nonempty
      - keywords_vocabulary/entries_nonempty
      - keywords_vocabulary/entries_prefixed
    severity: error
    message: prefix mismatch between keywords and vocabulary.